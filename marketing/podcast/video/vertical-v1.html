<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,800;0,900;1,900&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  /* Instagram Reel frame, 1080x1920, drawn one layer at a time (transparent but the base) for clip.py to animate:
     base (header, sign-off), on-m / on-a (who is talking, top right), hook (the opening banner), why (one reason row,
     or the panel title with row=0), cap (a caption with one word lit). The visual fills 1000x730 from y 280.
     window.draw(params) redraws without a reload, so hundreds of caption frames render quickly. */
  :root { --ink: #14161a; --panel: #1c1f24; --line: #2c3037; --lime: #c6f24e; --red: #d93636; --hot: #ff5c5c; --paper: #f5f7f2; --mute: #8b919b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; color: var(--paper); font-family: Archivo, sans-serif; }
  body.base { background: var(--ink); background-image: radial-gradient(1200px 700px at 50% 32%, rgba(198, 242, 78, .07), transparent 70%); }
  .band { position: absolute; left: -10%; width: 120%; height: 12px; transform: rotate(-3deg); }
  .logo { position: absolute; left: 44px; top: 70px; height: 150px; }
  .sign { position: absolute; left: 60px; right: 60px; bottom: 96px; text-align: center; }
  .sign .l1 { font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 40px; }
  .sign .l2 { font: 600 30px "IBM Plex Mono", monospace; letter-spacing: 0.08em; color: var(--lime); margin-top: 10px; }
  .sign .l3 { font: 600 22px "IBM Plex Mono", monospace; letter-spacing: 0.08em; color: var(--mute); margin-top: 18px; }
  .frame { position: absolute; left: 34px; top: 274px; width: 1012px; height: 742px; border-radius: 22px; background: var(--panel); border: 1px solid var(--line); }

  .who { position: absolute; right: 44px; top: 96px; transform: scale(.82); transform-origin: right top; }
  .pill { display: flex; align-items: center; gap: 18px; padding: 12px 30px 12px 14px; border-radius: 999px; border: 5px solid var(--lime); background: var(--panel); box-shadow: 0 0 40px rgba(198, 242, 78, .3); }
  .pill.a { border-color: var(--paper); box-shadow: 0 0 40px rgba(245, 247, 242, .2); }
  .pill .face { width: 76px; height: 76px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; overflow: hidden; border: 3px solid var(--paper); }
  .pill .face img.m { width: 44px; } .pill .face img.s { width: 100%; height: 100%; object-fit: cover; }
  .pill .n { font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 40px; line-height: 1; }
  .pill .r { font: 600 20px "IBM Plex Mono", monospace; letter-spacing: 0.12em; color: var(--mute); margin-top: 4px; }

  /* The hook (layer hook, drawn as .hookbar): the show's tilted bars, over the visual for the first two seconds. */
  .hookbar { position: absolute; left: 0; right: 0; top: 470px; display: flex; flex-direction: column; align-items: center; transform: rotate(-4deg); }
  .hookbar span { display: block; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -0.02em; line-height: .9; padding: 18px 40px 24px; clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .hookbar .a { font-size: 74px; background: var(--paper); color: var(--ink); }
  .hookbar .b { font-size: 120px; margin-top: 10px; }
  .hookbar .b.lay { background: var(--red); color: var(--paper); } .hookbar .b.bet { background: var(--lime); color: var(--ink); }

  .reasons { position: absolute; left: 40px; right: 40px; top: 1036px; }
  .reasons .t { font: 600 26px "IBM Plex Mono", monospace; letter-spacing: 0.16em; text-transform: uppercase; color: var(--lime); margin: 0 0 12px 6px; height: 34px; }
  .reasons.lay .t { color: var(--hot); }
  .reasons .r { display: flex; align-items: center; gap: 18px; height: 64px; background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 0 22px; margin-bottom: 8px; font-weight: 800; font-size: 33px; }
  .reasons .r::before { content: ""; flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--mute); }
  .reasons .r.new { border-color: var(--lime); background: #232a1a; } .reasons .r.new::before { background: var(--lime); }
  .reasons.lay .r.new { border-color: var(--hot); background: #2b1b1d; } .reasons.lay .r.new::before { background: var(--hot); }
  .reasons .hide { visibility: hidden; }

  /* A play, drawn into the visual's box (40, 280, 1000x730): the call's colour bar, horse, prices, line, stats. */
  .pv { position: absolute; left: 40px; top: 280px; width: 1000px; height: 730px; border-radius: 22px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; }
  .pv .bar { display: flex; align-items: center; justify-content: space-between; padding: 0 34px; height: 120px; font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 84px; }
  .pv.lay .bar { background: var(--red); color: var(--paper); } .pv.bet .bar { background: #5aa9ff; color: var(--ink); } .pv.prime .bar { background: var(--lime); color: var(--ink); }
  .pv .bar small { font: 600 26px "IBM Plex Mono", monospace; letter-spacing: 0.1em; font-style: normal; text-align: right; line-height: 1.4; }
  .pv .body { padding: 34px; display: flex; flex-direction: column; gap: 22px; flex: 1; justify-content: center; }
  .pv .horse { font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 104px; line-height: .92; letter-spacing: -0.02em; }
  .pv .nums { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .pv .box { border-radius: 16px; background: #16191d; border: 1px solid var(--line); padding: 14px 22px; }
  .pv .box .l { font: 600 20px "IBM Plex Mono", monospace; letter-spacing: 0.14em; color: var(--mute); text-transform: uppercase; }
  .pv .box .v { font-weight: 800; font-size: 62px; }
  .pv .box.take { grid-column: 1 / 3; }
  .pv.lay .box.take { border-color: var(--hot); } .pv.lay .box.take .v { color: var(--hot); }
  .pv.bet .box.take { border-color: #5aa9ff; } .pv.bet .box.take .v { color: #5aa9ff; }
  .pv.prime .box.take { border-color: var(--lime); } .pv.prime .box.take .v { color: var(--lime); }
  .pv .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .pv .stats span { font: 600 21px "IBM Plex Mono", monospace; color: var(--paper); background: #16191d; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; }
  /* A day's numbers, drawn into the visual's box: kicker, one huge figure, three facts. */
  .st { position: absolute; left: 40px; top: 280px; width: 1000px; height: 730px; border-radius: 22px; background: var(--panel); border: 1px solid var(--line); padding: 50px 46px; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .st .k { font: 600 28px "IBM Plex Mono", monospace; letter-spacing: 0.16em; color: var(--lime); text-transform: uppercase; }
  .st .big { font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 190px; line-height: .86; color: var(--lime); letter-spacing: -0.03em; }
  .st .facts { display: flex; flex-direction: column; gap: 12px; }
  .st .f { display: flex; justify-content: space-between; align-items: center; background: #16191d; border: 1px solid var(--line); border-radius: 16px; padding: 16px 24px; font-weight: 800; font-size: 40px; }
  .st .f small { font: 600 22px "IBM Plex Mono", monospace; letter-spacing: 0.1em; color: var(--mute); text-transform: uppercase; }
  .caption { position: absolute; left: 50px; right: 50px; top: 1452px; height: 210px; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 66px; line-height: 1.04; text-shadow: 0 6px 30px rgba(0,0,0,.7); }
  .caption em { font-style: italic; color: var(--ink); background: var(--lime); padding: 0 10px; border-radius: 10px; text-shadow: none; }
</style>
</head>
<body>
<script>
  const esc = (s) => (s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
  window.draw = (q) => {
    const layer = q.layer ?? "base";
    const face = q.avatar ? `<img class="s" src="${q.avatar}">` : "SM";
    const rows = (q.items ?? "").split("|").filter(Boolean);
    const row = Number(q.row ?? 0);
    const html = {
      base: `<div class="band" style="top:44px;background:var(--lime)"></div><div class="band" style="bottom:44px;background:var(--red)"></div>
        <img class="logo" src="../show/show-logo.png"><div class="frame"></div>
        <div class="sign"><div class="l1">${esc(q.cta ?? "Full episode on YouTube and Spotify")}</div><div class="l2">theoverlay.com.au</div><div class="l3">18+ · Gamble responsibly · Gambling Help 1800 858 858</div></div>`,
      "on-m": `<div class="who"><div class="pill"><div class="face"><img class="m" src="../../../public/brand/mark-mono-white.svg"></div><div><div class="n">The Overlay</div><div class="r">MATT</div></div></div></div>`,
      "on-a": `<div class="who"><div class="pill a"><div class="face">${face}</div><div><div class="n">The Stablemate</div><div class="r">ALEX KERR</div></div></div></div>`,
      hook: `<div class="hookbar"><span class="a">${esc(q.a)}</span><span class="b ${esc(q.tone)}">${esc(q.b)}</span></div>`,
      // row=0 draws the title alone; row=k draws only reason k, in its place, lit if new=1.
      why: `<div class="reasons ${esc(q.tone)}"><div class="t ${row ? "hide" : ""}">${esc(q.k)}</div>${rows.map((x, i) => `<div class="r ${i + 1 === row ? (q.new === "1" ? "new" : "") : "hide"}">${esc(x)}</div>`).join("")}</div>`,
      play: `<div class="pv ${esc(q.tone)}"><div class="bar">${esc(q.tag)}<small>${esc(q.k).replace(" · ", "<br>")}</small></div><div class="body"><div class="horse">${esc(q.t)}</div><div class="nums"><div class="box"><div class="l">Market</div><div class="v">${esc(q.mkt)}</div></div><div class="box"><div class="l">Our price</div><div class="v">${esc(q.rated)}</div></div><div class="box take"><div class="l">${esc(q.side)}</div><div class="v">${esc(q.line)}</div></div></div><div class="stats">${(q.stats ?? "").split("|").filter(Boolean).map((x) => `<span>${esc(x)}</span>`).join("")}</div></div></div>`,
      stat: `<div class="st"><div class="k">${esc(q.k)}</div><div class="big">${esc(q.t)}</div><div class="facts">${(q.facts ?? "").split("|").filter(Boolean).map((x) => { const [l, v] = x.split("="); return `<div class="f"><small>${esc(l)}</small><span>${esc(v)}</span></div>`; }).join("")}</div></div>`,
      // One word lit: on=<index>.
      cap: `<div class="caption"><div>${(q.t ?? "").split(" ").map((w, i) => (i === Number(q.on) ? `<em>${esc(w)}</em>` : esc(w))).join(" ")}</div></div>`,
    };
    document.body.className = layer;
    document.body.innerHTML = html[layer];
    return Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]);
  };
  window.draw(Object.fromEntries(new URLSearchParams(location.search))).then(() => (document.body.dataset.ready = "1"));
</script>
</body>
</html>
